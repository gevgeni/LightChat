services:
  light-chat-redis:
    image: redis:7-alpine
    container_name: light-chat-redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - light-chat-network

  litechat-db:
    image: postgres:16-alpine
    container_name: litechat_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ')"LK-7cV)>wxs*%a'
      POSTGRES_DB: litechat_db
    ports:
      - "5432:5432"
    volumes:
      - litechat-data:/var/lib/postgresql/data
    networks:
      - light-chat-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lightchat-rabbitmq
    restart: always
    ports:
      - "5672:5672"   # AMQP порт для .NET бэкенда
      - "15672:15672" # Web UI панель управления
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - light-chat-network

networks:
  light-chat-network:
    driver: bridge

volumes:
  litechat-data: